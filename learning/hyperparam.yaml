simulation:
  seed: 1
  sim_dt: 0.002
  max_t: 5.0
  warmup_t: 0.5 # held on trim before release, while the actuators settle (s)
  num_envs: 4
  num_threads: 10
  com_latency: 5.0e-3 # simulated communication latency, policy to actuators (s)
  offboard_dt: 0.01 # offboard guidance period (s)
  offboard_latency: 0.03 # offboard guidance to vehicle latency (s)

randomization: # uniform, +/- fraction of nominal, resampled every episode
  enabled: true
  mass: 0.15
  inertia_xx: 0.20
  inertia_yy: 0.20
  inertia_zz: 0.20
  propellerThrustFromSpeedSqr: 0.15
  propellerTorqueFromThrust: 0.15
  motorTimeConst: 0.30

observation_space:
  history_len: 100
  state_obs_size: 10
  act_size: 6 # motor R, motor L, aileron R, aileron L, tail R, tail L
  env_obs_size: 7 # physical parameters given to the teacher
  latent_size: 8

rewards:
  yaw_vel_coeff: -0.2 # for yaw rate tracking
  pitch_vel_coeff: -0.2 # for pitch rate tracking
  roll_vel_coeff: -0.2 # for roll rate tracking
  lin_accel_coeff: -0.01 # for linear acceleration
  survive_coeff: 10 # reward coeff for survive
  oscillate_coeff : -0.06 # reward coeff for oscillation
  crash_coeff: -10 # reward coeff for crash
  names:
    [
      "roll_vel_penalty",
      "pitch_vel_penalty",
      "yaw_vel_penalty",
      "lin_accel_penalty",
      "survive_reward",
      "oscillate_reward",
      "total",
    ]