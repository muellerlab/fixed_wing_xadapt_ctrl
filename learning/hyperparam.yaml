simulation:
  seed: 1
  sim_dt: 0.002
  max_t: 5.0
  warmup_t: 0.5 # held on trim before release, while the actuators settle (s)
  num_envs: 16
  num_threads: 10
  com_latency: 5.0e-3 # simulated communication latency, policy to actuators (s)
  offboard_dt: 0.01 # offboard guidance period (s)
  offboard_latency: 0.03 # offboard guidance to vehicle latency (s)

randomization: # uniform, +/- fraction of nominal, resampled every episode
  enabled: true
  mass: 0.15
  inertia_xx: 0.20
  inertia_yy: 0.20
  inertia_zz: 0.20
  propellerThrustFromSpeedSqr: 0.15
  propellerTorqueFromThrust: 0.15
  motorTimeConst: 0.30

wind: # steady wind in the world frame
  enabled: true
  max_speed: 10.0 # [m/s] horizontal: direction uniform, magnitude uniform in [0, max_speed]
  max_vertical: 0.0 # [m/s] vertical wind
  privileged: true # append wind to the teacher's physical parameters

turbulence: # Dryden gusts (linear only), own random sequence per vehicle and episode
  enabled: true
  intensities: [light] # light | moderate | severe
  burn_in_t: 20.0 # [s] gust filters run before each episode so the gusts start at steady state

observation_space:
  history_len: 100
  state_obs_size: 10
  act_size: 6 # motor R, motor L, aileron R, aileron L, tail R, tail L
  env_obs_size: 10 
  latent_size: 8

policy: # Phase 1 network 
  env_net_arch: [64, 64] # intrinsics encoder
  pi_arch: [256, 256] # actor 
  vf_arch: [512, 512] # critic 
  log_std_init: -0.5

ppo: # Phase 1
  total_timesteps: 1.0e+6
  BC_decay_timesteps: 5.0e+5

dagger: # Phase 2 
  encoder: 
    type: mlp # mlp now; hopefully cnn or rnn
    hidden: [256, 128]
  total_timesteps: 4.0e+5
  n_steps: 2500 # one full max_t = 5 s episode per env per iteration, as Phase 1
  n_epochs: 5
  batch_size: 2500
  learning_rate: 1.0e-3
  max_grad_norm: 1.0
  eval_every: 5 # iterations
  save_every: 10 # iterations
  n_eval_episodes: 10

rewards:
  yaw_vel_coeff: -0.2 # for yaw rate tracking
  pitch_vel_coeff: -0.2 # for pitch rate tracking
  roll_vel_coeff: -0.2 # for roll rate tracking
  lin_accel_coeff: -0.01 # for linear acceleration
  survive_coeff: 10 # reward coeff for survive
  oscillate_coeff : -0.06 # reward coeff for oscillation
  crash_coeff: -10 # reward coeff for crash
  names:
    [
      "roll_vel_penalty",
      "pitch_vel_penalty",
      "yaw_vel_penalty",
      "lin_accel_penalty",
      "survive_reward",
      "oscillate_reward",
      "total",
    ]